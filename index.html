<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f7c8d6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1526" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cycle Care" />
  <meta name="description" content="A gentle period tracker for a boyfriend who wants to show up and care." />
  <title>Cycle Care</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/favicon-64.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Animated Liquid-Glass background -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <div class="app" id="app">
    <!-- Views are rendered here -->
    <main class="views" id="views"></main>

    <!-- iOS-style glass tab bar -->
    <nav class="tabbar glass" id="tabbar" aria-label="Main navigation">
      <button class="tab" data-view="today" aria-label="Today">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.51 8.51 0 0 0 12 3.5Zm0 15A6.5 6.5 0 1 1 18.5 12 6.5 6.5 0 0 1 12 18.5Z"/><path d="M12.75 8a.75.75 0 0 0-1.5 0v4a.75.75 0 0 0 .3.6l2.5 1.9a.75.75 0 1 0 .9-1.2l-2.2-1.68Z"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-view="calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24" class="ico"><path d="M7 2.75a.75.75 0 0 1 .75.75V4.5h8.5V3.5a.75.75 0 0 1 1.5 0v1h.5A2.25 2.25 0 0 1 20.5 6.75v11A2.25 2.25 0 0 1 18.25 20h-12.5A2.25 2.25 0 0 1 3.5 17.75v-11A2.25 2.25 0 0 1 5.75 4.5h.5v-1A.75.75 0 0 1 7 2.75Zm-1.25 6v9c0 .41.34.75.75.75h12.5a.75.75 0 0 0 .75-.75v-9Z"/></svg>
        <span>Calendar</span>
      </button>
      <button class="tab" data-view="care" aria-label="Care">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 20.3s-7.5-4.6-9.7-9.2C1 8.1 2.3 4.7 5.6 4.2c2-.3 3.8.7 4.9 2.3C11.6 4.9 13.4 3.9 15.4 4.2c3.3.5 4.6 3.9 3.3 6.9-2.2 4.6-6.7 9.2-6.7 9.2Z"/></svg>
        <span>Care</span>
      </button>
      <button class="tab" data-view="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 8.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5Zm0 5.5A2 2 0 1 1 14 12a2 2 0 0 1-2 2Z"/><path d="m20.4 13-.1-1 .1-1 1.4-1.1a.6.6 0 0 0 .15-.75l-1.5-2.6a.6.6 0 0 0-.72-.26l-1.66.67a6.9 6.9 0 0 0-1.7-1l-.25-1.76A.6.6 0 0 0 14.9 2h-3a.6.6 0 0 0-.6.5l-.25 1.76a6.9 6.9 0 0 0-1.7 1L7.7 4.6a.6.6 0 0 0-.72.26l-1.5 2.6a.6.6 0 0 0 .14.75L7 9.9l-.1 1 .1 1-1.4 1.1a.6.6 0 0 0-.14.75l1.5 2.6a.6.6 0 0 0 .72.26l1.66-.67a6.9 6.9 0 0 0 1.7 1l.25 1.76a.6.6 0 0 0 .6.5h3a.6.6 0 0 0 .6-.5l.25-1.76a6.9 6.9 0 0 0 1.7-1l1.66.67a.6.6 0 0 0 .72-.26l1.5-2.6a.6.6 0 0 0-.15-.75Z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
